root: "../../out"
schema_version: 1

dataset:
  name: "opencivitas_determinanti"
  source_id: "opencivitas"
  tags: [finanza-pubblica, opencivitas, determinanti, spesa-standard, performance]
  category: finanza-pubblica
  years: [2015, 2016, 2017, 2018, 2019, 2021, 2022]
  time_coverage:
    start_year: 2015
    end_year: 2022

support:
  - name: "opencivitas_fsc_enti_rso"
    config: "../../support/opencivitas-fsc-enti-rso/dataset.yml"
    years: [2025]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
  required_columns:
    - username
    - comune
    - spesa_standard_procapite
    - spesa_storica_procapite
    - livello_servizi
    - livello_spesa
    - join_enti_ok
  validate:
    min_rows: 5000
    primary_key:
      - "username"
    not_null:
      - "username"

mart:
  tables:
    - name: "mart_determinanti"
      sql: "sql/mart_determinanti.sql"
  required_tables:
    - "mart_determinanti"
  validate:
    table_rules:
      mart_determinanti:
        min_rows: 5000
        required_columns:
          - "username"
          - "comune"
          - "regione"
          - "popolazione"
          - "spesa_standard_procapite"
          - "spesa_storica_procapite"
          - "livello_servizi"
          - "livello_spesa"
          - "quadrante"
          - "fascia_popolazione"
        not_null:
          - "username"

validation:
  fail_on_error: true

output:
  artifacts: "standard"
