[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-opencivitas"
version = "0.1.0"
description = "OpenCivitas — dati civici e servizi al cittadino"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
    "openpyxl",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",

]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/opencivitas"

[tool.setuptools]
packages = []

[tool.toolkit.extends]
source_id = "opencivitas"

[tool.observatory]
source_id = "opencivitas"
protocol = "html"
base_url = "https://www.opencivitas.it/portale/open-data"
observation_mode = "catalog-watch"
verdict = "go"
note = "Portale Liferay OpenCivitas (live 2026-06). File consumati come URL diretti con UUID su /portale/documents/20118/0/. Il vecchio dominio docs.opencivitas.it è dismesso. Inventario via tabella catalogo Liferay; le faccette anno (2017-2026 + 'Altre annualità') richiedono iterazione per anno — vedi follow-up."

[[tool.observatory.pattern_probes]]
name = "fsc-2026-portale"
url = "https://www.opencivitas.it/portale/documents/20118/0/2026_VAR_FSC_1_2026_IT.csv/63988461-9ae1-ce7d-13f0-fab3c9c7b77a"

[[tool.observatory.pattern_probes]]
name = "fprcm-2026-portale"
url = "https://www.opencivitas.it/portale/documents/20118/0/2026_FPRCM_01_2026_IT.csv/02f9598f-6fb4-68cd-3346-80210af7ea56"

[tool.observatory.html_portal]
topic_hint = "trasparenza"
extraction = "liferay_catalog"
page_url_template = "https://www.opencivitas.it/portale/open-data?xpage={page}&xdelta=6"
page_max = 25
delay_seconds = 0.3
timeout_seconds = 10
max_retries = 1
