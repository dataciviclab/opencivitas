root: "../../out"
schema_version: 1

dataset:
  name: "opencivitas_indicatori"
  source_id: "opencivitas"
  tags: [finanza-pubblica, opencivitas, indicatori]
  category: finanza-pubblica
  years: [2015, 2016, 2017, 2018, 2019, 2021, 2022]
  time_coverage:
    start_year: 2015
    end_year: 2022

support:
  - name: "opencivitas_fsc_enti_rso"
    config: "../../support/opencivitas-fsc-enti-rso/dataset.yml"
    years: [2025]
  - name: "opencivitas_glossario"
    config: "../../support/opencivitas-glossario/dataset.yml"
    years: [2015, 2016, 2017, 2018, 2019, 2021, 2022]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    mode: latest
    source: auto
    delim: ";"
    encoding: "utf-8"
    decimal: ","
    header: true
  required_columns:
    - username
    - anno
    - ambito
    - indicatore
    - valore_num
    - descrizione_indicatore
    - tipo_indicatore
    - categoria_indicatore
    - funzione_indicatore
    - denominazione
    - provincia
    - regione
    - regione_istat_cod
    - join_enti_ok
    - join_metadati_ok
  validate:
    min_rows: 100000
    primary_key:
      - username
      - anno
      - ambito
      - indicatore
    not_null:
      - "username"
      - "anno"
      - "ambito"
      - "indicatore"
      - "valore_num"

mart:
  tables:
    - name: "mart_indicatori"
      sql: "sql/mart_indicatori.sql"
    - name: "mart_comuni"
      sql: "sql/mart_comuni.sql"
  required_tables:
    - "mart_indicatori"
    - "mart_comuni"
  validate:
    table_rules:
      mart_indicatori:
        min_rows: 100
        required_columns:
          - "anno"
          - "ambito"
          - "indicatore"
          - "n_comuni"
          - "media"
          - "mediana"
        not_null:
          - "anno"
          - "ambito"
          - "indicatore"
      mart_comuni:
        min_rows: 5000
        required_columns:
          - "username"
          - "anno"
          - "comune"
          - "regione"
        not_null:
          - "username"
          - "anno"

validation:
  fail_on_error: true

output:
  artifacts: "standard"
