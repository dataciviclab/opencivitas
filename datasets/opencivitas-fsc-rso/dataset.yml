root: "../../out"
schema_version: 1

dataset:
  name: "opencivitas_fsc_rso"
  source_id: "opencivitas"
  tags: [finanza-pubblica, opencivitas, fsc]
  category: finanza-pubblica
  years: [2017, 2018, 2020, 2021, 2022, 2023, 2024, 2025]
  time_coverage:
    start_year: 2017
    end_year: 2025

support:
  - name: "opencivitas_fsc_enti_rso"
    config: "../../support/opencivitas-fsc-enti-rso/dataset.yml"
    years: [2025]

raw:
  output_policy: overwrite
  sources:
    - type: script
      args:
        command: "python preprocess.py {year} raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
    header: false
    delim: ";"
    encoding: "utf-8"
    columns:
      column00: "VARCHAR"
      column01: "VARCHAR"
      column02: "VARCHAR"
    trim_whitespace: true
  required_columns:
    - anno
    - username
    - comune
    - provincia
    - regione
    - regione_istat_cod
    - popolazione
    - capacita_fiscale
    - fondo_perequativo
    - dotazione_finale_fsc
    - join_enti_ok
  validate:
    min_rows: 1000
    primary_key:
      - username
      - anno
    promotion:
      max_row_drop_pct: 100
    not_null:
      - "username"
      - "comune"
      - "popolazione"
      - "join_enti_ok"

mart:
  tables:
    - name: "mart_compose_comuni"
      sql: "sql/mart_compose.sql"
  required_tables:
    - "mart_compose_comuni"
  validate:
    table_rules:
      mart_compose_comuni:
        min_rows: 1000
        primary_key:
          - username
          - anno
        required_columns:
          - "username"
          - "comune"
          - "popolazione"
          - "capacita_fiscale"
          - "fondo_perequativo"
          - "join_enti_ok"
          - "capacita_fiscale_procapite"
          - "fondo_perequativo_procapite"
          - "dotazione_finale_fsc_procapite"
        not_null:
          - "username"
          - "comune"
          - "popolazione"
          - "join_enti_ok"

validation:
  fail_on_error: true

output:
  artifacts: "standard"
