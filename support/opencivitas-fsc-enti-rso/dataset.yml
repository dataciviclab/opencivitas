root: "../../out"
schema_version: 1

dataset:
  name: "opencivitas_fsc_enti_rso"
  source_id: "opencivitas"
  tags: [finanza-pubblica, opencivitas, fsc, enti]
  category: finanza-pubblica
  years: [2025]
  time_coverage:
    start_year: 2025
    end_year: 2025

# Fonte: portale Liferay OpenCivitas (XLSX diretto, URL con UUID).
# Il vecchio ZIP su docs.opencivitas.it è dismesso (dominio non più raggiungibile).
# Se il run va in 404, recuperare il nuovo URL dall'inventario del catalog-watch
# (registry/catalog.json / out/so/inventory.parquet).
raw:
  output_policy: overwrite
  sources:
    - name: "opencivitas_fsc_enti_2025_xlsx"
      type: "http_file"
      args:
        url: "https://www.opencivitas.it/portale/documents/20118/0/Metadati_Enti_FSC_2025/ce487ca0-53ee-5162-7df9-24307a773af4"
        filename: "Metadati_Enti_FSC_2025.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    header: true
    sheet_name: "anagrafica_enti2025"
    trim_whitespace: true
  required_columns:
    - username
    - denominazione
    - provincia
    - regione
    - regione_istat_cod
  validate:
    min_rows: 1000
    primary_key: username
    not_null:
      - "username"
      - "denominazione"

mart:
  tables:
    - name: "mart_enti"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_enti"
  validate:
    table_rules:
      mart_enti:
        min_rows: 1000
        primary_key: username

validation:
  fail_on_error: true

output:
  artifacts: "standard"
